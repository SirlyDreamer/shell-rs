# Push v<version> matching Cargo.toml and both changelogs to publish on GitHub.
# A manual run on a branch builds artifacts only; on a version tag it also
# publishes the release. No external signing or hosting secrets
# are required; these packages use manual updates from this repository.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SHELLRS_UPDATE_CHANNEL: ""

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Version and channel
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          case "$version" in *-*) channel=beta ;; *) channel=stable ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        run: |
          version=${{ steps.version.outputs.version }}
          section() {
            awk -v heading="## [$version]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' "$1" | sed -e '/./,$!d'
          }
          for changelog in CHANGELOG.md CHANGELOG.zh.md; do
            if [ -z "$(section "$changelog")" ]; then
              echo "::error::$changelog has no section ## [$version]"
              exit 1
            fi
          done
          section CHANGELOG.md > notes.md
          cat notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  macos:
    needs: verify
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    timeout-minutes: 120
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.verify.outputs.version }}
      SHELLRS_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: rustup target add "$ARCH-apple-darwin"
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}
      - name: Build the architecture-specific app
        run: |
          export SHELLRS_BUILD_DATE=$(date -u +%Y-%m-%d)
          cargo build --release --locked --bin shellrs --target "$ARCH-apple-darwin"
          mkdir -p dist build
          lipo "target/$ARCH-apple-darwin/release/shellrs" -verify_arch "${ARCH/aarch64/arm64}"
          packaging/macos/bundle.sh "target/$ARCH-apple-darwin/release/shellrs" "$VERSION" "$GITHUB_RUN_NUMBER" build
      - name: Package without Developer ID or notarization
        run: |
          # Ad-hoc signing keeps the ARM bundle internally consistent. It
          # does not establish a developer identity or bypass Gatekeeper.
          codesign --force --deep --sign - build/ShellRS.app
          codesign --verify --deep --strict build/ShellRS.app
          ditto -c -k --keepParent build/ShellRS.app "dist/ShellRS-$VERSION-macos-$ARCH.app.zip"
          mkdir -p "$RUNNER_TEMP/dmg"
          cp -R build/ShellRS.app "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          dmg="dist/ShellRS-$VERSION-macos-$ARCH.dmg"
          size=$(( $(du -sm "$RUNNER_TEMP/dmg" | cut -f1) * 2 + 20 ))
          for attempt in 1 2 3; do
            hdiutil create -volname ShellRS -srcfolder "$RUNNER_TEMP/dmg" -ov \
              -fs HFS+ -size "${size}m" -format UDZO "$dmg" && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*

  windows:
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SHELLRS_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/setup-nasm@v1
      - name: Build
        shell: bash
        run: |
          export SHELLRS_BUILD_DATE=$(date -u +%Y-%m-%d)
          cargo build --release --locked --bins
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y; }
          & $iscc "/DAppVersion=$env:VERSION" "/DBuildDir=$env:GITHUB_WORKSPACE\target\release" `
            "/O$env:GITHUB_WORKSPACE\dist" packaging\windows\shellrs.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Portable
        shell: pwsh
        run: |
          # The portable zip: both programs at its root beside an empty
          # data folder, which is what
          # makes a copy portable. 7-Zip keeps the empty folder;
          # Compress-Archive would drop it.
          $folder = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force -Path (Join-Path $folder "data") | Out-Null
          Copy-Item "target\release\shellrs.exe", "target\release\shellrs-cli.exe" $folder
          $zip = "$env:GITHUB_WORKSPACE\dist\ShellRS-$env:VERSION-windows-x86_64-portable.zip"
          Push-Location $folder
          7z a -tzip -mx=9 $zip shellrs.exe shellrs-cli.exe data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          # The first path listed is the archive itself.
          $entries = 7z l -slt $zip | Select-String '^Path = ' |
            ForEach-Object { $_.Line.Substring(7) } | Select-Object -Skip 1
          if (Compare-Object @($entries) @('data', 'shellrs-cli.exe', 'shellrs.exe')) {
            Write-Error "The portable zip holds: $($entries -join ', ')"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    needs: verify
    # Build on glibc 2.31, keeping compatibility with Ubuntu 20.04/Debian 11.
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SHELLRS_COMMIT: ${{ github.sha }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git file \
            build-essential cmake clang pkg-config libfontconfig-dev \
            libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libdbus-1-dev libssl-dev
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-20.04
      - name: Build
        run: |
          export SHELLRS_BUILD_DATE=$(date -u +%Y-%m-%d)
          cargo build --release --locked --bin shellrs
      - name: Needs glibc 2.31 at most
        run: |
          needed=$(objdump -T target/release/shellrs | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "The binary needs $needed"
          test "$(printf '%s\n' "$needed" GLIBC_2.31 | sort -V | tail -1)" = GLIBC_2.31
      - name: AppImage
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          export APPIMAGE_EXTRACT_AND_RUN=1
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" \
            packaging/linux/appimage.sh target/release/shellrs "$VERSION" dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  publish:
    needs: [verify, macos, windows, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      CHANNEL: ${{ needs.verify.outputs.channel }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect packages and checksums
        run: |
          mkdir -p dist
          cp artifacts/macos-aarch64/* artifacts/macos-x86_64/* artifacts/windows/* artifacts/linux/* dist/
          cp artifacts/notes/notes.md notes.md
          (cd dist && sha256sum ShellRS-* > SHA256SUMS)
      - name: GitHub Release
        run: |
          prerelease=()
          [ "$CHANNEL" != beta ] || prerelease=(--prerelease)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" dist/* --clobber
          else
            gh release create "v$VERSION" dist/* --verify-tag --title "ShellRS $VERSION" \
              --notes-file notes.md "${prerelease[@]}"
          fi
